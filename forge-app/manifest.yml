modules:
  rovo:agent:
    - key: spendpilot
      name: SpendPilot
      description: >-
        A governed spend-intake assistant that turns natural-language
        purchasing requests into validated planning data and Jira review issues.
      prompt: >
        You are **SpendPilot**, a governed spend-intake assistant. Convert a
        user's natural-language purchasing request into structured planning data
        by calling `parse-spend-request` with the exact request text.


        Intake is read-only. Never approve a request, choose a merchant, search,
        cart, order, purchase, or claim that money is authorized. Never invent
        missing facts. If the parser reports missing fields or ambiguity, present
        its clarification questions and wait for the user's answer. A parsed
        result is not authorization to spend.


        Only after the user explicitly asks to create a Jira spend request, and
        provides a project key, call create-jira-spend-request. That action only
        creates a review issue containing the structured request. Tell the user
        the issue key and remind them that approval and purchase are separate.
      conversationStarters:
        - I need 12 ergonomic keyboards for the support team under USD 1,800.
        - Help me structure a request for a design subscription.
      actions:
        - parse-spend-request
        - create-jira-spend-request
  action:
    - key: parse-spend-request
      name: Parse a spend request
      function: parseSpendRequest
      actionVerb: GET
      description: >-
        Read-only intake: extract and validate planning information from a
        natural-language spend request. It never approves, writes, shops, or
        purchases.
      inputs:
        request:
          title: Spending request
          type: string
          required: true
          description: The user's complete natural-language purchasing or spend request.
    - key: create-jira-spend-request
      name: Create a Jira spend request
      function: createJiraSpendRequest
      actionVerb: POST
      description: >-
        Create a Jira Task issue containing a structured spend request for
        review. This does not approve, purchase, reserve funds, or charge money.
      inputs:
        projectKey:
          title: Jira project key
          type: string
          required: true
          description: The Jira project key where the review issue should be created.
        summary:
          title: Issue summary
          type: string
          required: true
          description: A short summary for the spend request issue.
        description:
          title: Spend request details
          type: string
          required: true
          description: The structured business request and desired outcome.
        budget:
          title: Budget
          type: string
          required: true
          description: The maximum budget and currency, for example 1800 USD.
        constraints:
          title: Constraints
          type: string
          required: false
          description: Comma-separated purchasing constraints.
  function:
    # Forge requires at least one function definition on every app.
    - key: placeholder
      handler: index.placeholder
    - key: parseSpendRequest
      handler: index.parseSpendRequest
    - key: createJiraSpendRequest
      handler: index.createJiraSpendRequest
permissions:
  scopes:
    - write:jira-work
  external:
    fetch:
      backend:
        - address: "https://api.openai.com"
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c1b539e4-9dda-42cb-b0d4-f7f3283d1bed
